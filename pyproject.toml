[project]
name = "lmpu"
version = "0.1.0"
description = "Language Model Processing Unit - Semantic control plane for native computation"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "LMPU Contributors"}]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.10,<3",
    "orjson>=3.10,<4",
    "numpy>=2.0,<3",
    "blake3>=0.4,<1",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0,<7",
    "ulid-py>=1.1,<2",
    "psutil>=5.9,<7",
    "typer>=0.15,<1",
    "rich>=13,<16",
]

[project.optional-dependencies]
host = [
    "torch>=2.5,<3",
    "transformers>=5.16,<6",
    "tokenizers>=0.20,<1",
    "accelerate>=0.33,<1",
]
vllm = [
    "vllm==0.33.*",
    "transformers>=5.16,<5.21",
]
decoder = [
    "outlines>=0.1.14,<1",
    "lm-format-enforcer>=0.10,<1",
]
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sse-starlette>=2.0,<3",
    "pynvml>=12.0,<13",
]
bench = [
    "pytest-benchmark>=4.0,<5",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "pre-commit>=3.8,<4",
    "mutmut>=2.5,<3",
    "pyright>=1.1,<2",
]

[tool.uv.sources]
# Local development overrides if needed

[tool.uv]
# vLLM pins its own outlines-core, which cannot coexist with the decoder
# extra's outlines pin. The two are validated in isolated environments.
conflicts = [
    [{ extra = "vllm" }, { extra = "host" }],
    [{ extra = "vllm" }, { extra = "decoder" }],
    [{ extra = "vllm" }, { extra = "dashboard" }],
    [{ extra = "vllm" }, { extra = "bench" }],
]
dev-dependencies = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "pre-commit>=3.8,<4",
    "jsonschema>=4.23,<5",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lmpu*"]

[tool.setuptools.package-data]
"lmpu.schema" = ["*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TRY", # tryceratops
    "T20", # flake8-print
]
ignore = [
    "ARG001", # unused method argument (common in abstract methods)
    "ARG002", # unused method argument
    "TRY003", # avoid specifying long messages outside the exception class
    "T201",   # print statements allowed in CLI/doctor
]
per-file-ignores = { "tests/**/*.py" = ["S101", "T201"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pydantic*",
    "orjson",
    "numpy",
    "torch*",
    "transformers*",
    "vllm*",
    "outlines*",
    "fastapi*",
    "pynvml*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Pure function and logic tests, no I/O",
    "property: Property-based tests",
    "contract: Processor contract conformance tests",
    "integration: Kernel + workers + scripted host, no LLM",
    "scenario: Full session loop with scripted control blocks",
    "gpu: Requires GPU",
    "model: Requires LLM model loaded",
    "failure: Failure injection tests",
    "security: Sandbox and security tests",
    "fuzz: Fuzzing tests",
    "perf: Performance microbenchmarks",
    "soak: Long-running soak tests",
]
addopts = "-v --tb=short -x -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/lmpu"]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2

[tool.pre-commit-hooks]
# Managed by .pre-commit-config.yaml

[project.scripts]
lmpu = "lmpu.cli:main"
lmpu-doctor = "lmpu.doctor:main"
lmpu-worker = "lmpu.worker:main"
